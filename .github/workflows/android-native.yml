name: Android compile check

# Compile the ARM64 library and Kotlin/Java sources. No signing or APK.
on:
  pull_request:
    paths:
      - '.github/workflows/android-native.yml'
      - '.github/workflows/package.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'src-tauri/**'
      - 'scripts/stage-onnx-runtime.py'
      - 'scripts/prepare-android-gradle.sh'
      - 'scripts/android-ci-annotate.py'
      - 'scripts/android-runtime-inventory.init.gradle'
      - 'scripts/report-android-runtime-licenses.py'
      - 'scripts/verify-android-release-manifest.py'
      - 'legal/android/**'
      - 'package*.json'
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'vite.config.*'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  arm64:
    name: Compile Android arm64 (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: '28.2.13676358'
      CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-ndk-r28c-codegen
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android NDK and native build tools
        shell: bash
        run: |
          sdkmanager --install "ndk;$ANDROID_NDK_VERSION"
          for variable in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK NDK_HOME; do
            echo "$variable=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          done
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Stage and verify the real NDK C++ runtime without an APK
        shell: bash
        run: |
          python3 scripts/stage-onnx-runtime.py stage-android-cxx \
            --ndk "$ANDROID_NDK_HOME" --dest "$RUNNER_TEMP/android-cxx"
      - name: Build the embedded web frontend
        run: |
          npm ci
          npm run build
      - name: Generate the Tauri Android project and prepare code generation
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/src-tauri/gen/android"
          log="$RUNNER_TEMP/championvibe-android-setup.log"
          if ! (npm run tauri -- android init --ci --skip-targets-install &&
            bash scripts/prepare-android-gradle.sh "$project") 2>&1 | tee "$log"; then
            python3 scripts/android-ci-annotate.py 'Android project setup diagnostics' "$log"
            exit 1
          fi
          package=$(node -p 'require("./src-tauri/tauri.conf.json").identifier')
          kotlin_dir="$project/app/src/main/java/${package//./\/}/generated"
          mkdir -p "$kotlin_dir"
          {
            echo "TAURI_ANDROID_PROJECT_PATH=$project"
            echo "TAURI_ANDROID_PACKAGE_UNESCAPED=$package"
            echo "WRY_ANDROID_PACKAGE=$package"
            echo 'WRY_ANDROID_LIBRARY=championvibe_lib'
            echo "WRY_ANDROID_KOTLIN_FILES_OUT_DIR=$kotlin_dir"
          } >> "$GITHUB_ENV"
      - name: Compile and link the app shared library for Android API 26
        shell: bash
        run: |
          log="$RUNNER_TEMP/championvibe-android-build.log"
          if ! cargo ndk -t arm64-v8a --platform 26 build --release --locked --package championvibe --lib 2>&1 | tee "$log"; then
            python3 "scripts/android-ci-annotate.py" 'Android arm64 build diagnostics' "$log"
            exit 1
          fi
      - name: Verify arm64 ELF alignment and the audio bridge export
        shell: bash
        run: |
          library=target/aarch64-linux-android/release/libchampionvibe_lib.so
          python3 scripts/stage-onnx-runtime.py verify-android-library "$library"
          readelf --dyn-syms --wide "$library" > /tmp/championvibe-android-symbols.txt
          grep -E 'GLOBAL +DEFAULT +[0-9]+ +Java_com_championvibe_deviceidentity_DeviceIdentityPlugin_nativeInitializeAudioContext$' /tmp/championvibe-android-symbols.txt
          dependencies=$(readelf --dynamic "$library" | awk -F '[][]' '/\(NEEDED\)/ { print $2 }' | paste -sd ' ' -)
          echo "::notice title=Android arm64 dynamic dependencies::$dependencies"
          {
            echo '### Android arm64 shared library (no APK)'
            echo '```text'
            sha256sum "$library"
            readelf --dynamic "$library" | grep -F '(NEEDED)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compile the generated Android app and its plugins without packaging
        working-directory: src-tauri/gen/android
        shell: bash
        run: |
          for module in tauri-android tauri-plugin-device-identity; do
            if ! grep -Fq "include ':$module'" tauri.settings.gradle; then
              echo "::error title=Missing Android Gradle module::$module"
              exit 1
            fi
          done
          log="$RUNNER_TEMP/championvibe-gradle.log"
          if ! bash ./gradlew --no-daemon --console=plain \
            :app:compileArm64ReleaseKotlin :app:compileArm64ReleaseJavaWithJavac \
            :app:processArm64ReleaseMainManifest 2>&1 | tee "$log"; then
            python3 "$GITHUB_WORKSPACE/scripts/android-ci-annotate.py" 'Android Gradle compile diagnostics' "$log"
            exit 1
          fi
          if find app/build/outputs -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo 'Compile-only check unexpectedly generated an APK' >&2
            exit 1
          fi
      - name: Verify Android release identity, compatibility and permissions
        shell: bash
        run: |
          manifest=src-tauri/gen/android/app/build/intermediates/merged_manifest/arm64Release/processArm64ReleaseMainManifest/AndroidManifest.xml
          output=$(python3 scripts/verify-android-release-manifest.py "$manifest" --target-sdk 36)
          printf '%s\n' "$output" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Android release permissions::$(printf '%s\n' "$output" | tail -n 1)"
      - name: Inventory Android release runtime dependencies without packaging
        working-directory: src-tauri/gen/android
        shell: bash
        run: |
          inventory="$RUNNER_TEMP/android-runtime-inventory"
          log="$RUNNER_TEMP/championvibe-gradle-runtime.log"
          if ! bash ./gradlew --no-daemon --console=plain --no-configuration-cache \
            --init-script "$GITHUB_WORKSPACE/scripts/android-runtime-inventory.init.gradle" \
            "-PruntimeInventoryDir=$inventory" :app:collectArm64ReleaseRuntimeInventory 2>&1 | tee "$log"; then
            python3 "$GITHUB_WORKSPACE/scripts/android-ci-annotate.py" 'Android Gradle runtime inventory diagnostics' "$log"
            exit 1
          fi
          report="$RUNNER_TEMP/android-gradle-runtime-licenses.json"
          python3 "$GITHUB_WORKSPACE/scripts/report-android-runtime-licenses.py" "$inventory" "$report" | tee "$inventory/summary.txt"
          {
            echo '### Android release runtime licence inventory (no APK)'
            cat "$inventory/summary.txt"
            echo 'Publisher declarations only; check upstream notices and redistribution terms before publishing.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Android release runtime licence inventory::$(head -n 1 "$inventory/summary.txt")"
          # Surface the review queue even when artifact downloads aren't available.
          python3 - "$report" <<'PYTHON'
          import json
          from pathlib import Path
          import sys

          modules = json.loads(Path(sys.argv[1]).read_text())["modules"]
          pending = [entry for entry in modules if entry["licenseStatus"] not in {"declared", "upstream-source-documented"}]
          for entry in pending[:20]:
              detail = f'{entry["coordinates"]}: {entry["licenseStatus"]}'
              detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=Android dependency licence review::{detail}")
          PYTHON
      - name: Upload the Android release runtime licence inventory
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-runtime-licenses
          path: ${{ runner.temp }}/android-gradle-runtime-licenses.json
          if-no-files-found: error
          retention-days: 30
