name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust format, check, and workspace tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux/Tauri audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            portaudio19-dev \
            librsvg2-dev \
            wget

      - name: Install frontend dependencies and generate Tauri assets
        run: |
          npm ci
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check the complete Rust workspace
        id: rust_check
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo check --workspace --message-format=json 2>&1 | tee cargo-check.json
          result=${PIPESTATUS[0]}
          exit "$result"

      - name: Extract structured Rust compiler errors temporarily
        if: failure() && steps.rust_check.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          errors = []
          for line in Path("cargo-check.json").read_text(errors="replace").splitlines():
              try:
                  record = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if record.get("reason") != "compiler-message":
                  continue
              message = record.get("message", {})
              if message.get("level") == "error":
                  errors.append(message.get("rendered") or message.get("message", ""))

          output = Path("rust-errors.log")
          if errors:
              output.write_text(chr(10).join(errors))
          else:
              output.write_text("No structured compiler errors; last cargo messages:" + chr(10) + chr(10).join(Path("cargo-check.json").read_text(errors="replace").splitlines()[-200:]))
          PY

      - name: Upload temporary Rust compiler errors
        if: failure() && steps.rust_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostic-rust
          path: rust-errors.log
          if-no-files-found: error
          retention-days: 1

      - name: Test the complete Rust workspace
        run: cargo test --workspace

  package:
    name: Package ${{ matrix.platform }} test artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact-name: championvibe-windows-test-build
          - platform: android
            os: ubuntu-latest
            artifact-name: championvibe-android-apk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Android Rust targets
        if: matrix.platform == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install Windows desktop prerequisites
        if: matrix.platform == 'windows'
        run: choco install wixtoolset --yes --no-progress

      - name: Set up Java for Android Gradle
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages and NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Android Rust bridge tooling
        if: matrix.platform == 'android'
        run: cargo install cargo-ndk --locked

      - name: Install frontend and Tauri CLI dependencies
        run: npm ci

      - name: Build Windows MSI and NSIS installer
        id: windows_build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          npm run tauri -- build --ci --bundles msi,nsis 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload temporary Windows build diagnostics
        if: failure() && steps.windows_build.outcome == 'failure'
        shell: pwsh
        run: |
          Get-Content windows-build.log -Tail 3000 | Set-Content windows-build-diagnostics.log

      - name: Upload Windows build diagnostic artifact
        if: failure() && steps.windows_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostic-windows
          path: windows-build-diagnostics.log
          if-no-files-found: error
          retention-days: 1

      - name: Initialize Tauri Android project
        if: matrix.platform == 'android'
        run: npm run tauri -- android init --ci

      - name: Build Android APK test package
        id: android_build
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set +e
          npm run tauri -- android build --ci --apk 2>&1 | tee android-build.log
          result=${PIPESTATUS[0]}
          exit "$result"

      - name: Upload temporary Android build diagnostics
        if: failure() && steps.android_build.outcome == 'failure'
        shell: bash
        run: tail -n 3000 android-build.log > android-build-diagnostics.log

      - name: Upload Android build diagnostic artifact
        if: failure() && steps.android_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostic-android
          path: android-build-diagnostics.log
          if-no-files-found: error
          retention-days: 1

      - name: Collect Windows installers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path target/release/bundle, src-tauri/target/release/bundle -Recurse -File -Include *.msi,*.exe -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts
          if (-not (Get-ChildItem artifacts -File)) { throw 'No Windows MSI/EXE installers were produced.' }

      - name: Collect Android APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android -type f -path '*/build/outputs/apk/*' -name '*.apk' -exec cp '{}' artifacts/ \;
          test -n "$(find artifacts -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload test installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  diagnostics:
    name: Temporarily collect failed CI diagnostics
    if: always() && (needs.rust.result == 'failure' || needs.package.result == 'failure')
    needs:
      - rust
      - package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Clear previous temporary diagnostics
        run: rm -rf .ci-diagnostics

      - name: Download diagnostics from failed jobs
        uses: actions/download-artifact@v4
        with:
          pattern: ci-diagnostic-*
          path: .ci-diagnostics
          merge-multiple: false

      - name: Publish temporary diagnostics to the session branch
        shell: bash
        run: |
          if ! find .ci-diagnostics -type f -print -quit | grep -q .; then
            echo "No diagnostics artifacts were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-diagnostics
          git commit -m "Temporarily record CI build diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
