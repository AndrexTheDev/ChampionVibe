name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  compliance:
    name: Cleared-model compliance checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Offline gate: registry pins and tiers, forbidden sources, bundled-weight scan, BYOM
      # acknowledgement rules, CC0 sampleboard bytes, locale transparency and the locked build.
      - name: Verify the cleared-model policy
        run: scripts/verify-cleared-model-policy.sh

  rust:
    name: Rust format, check, and workspace tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux/Tauri audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            portaudio19-dev \
            librsvg2-dev \
            wget

      - name: Install frontend dependencies and generate Tauri assets
        run: |
          npm ci
          npm run build

      # TEMPORARY diagnostics (remove before merge): raw job logs are not always retrievable in
      # this environment, so the rustfmt diff and the compiler messages are re-emitted as a single
      # check annotation each (GitHub caps the number of annotations per job, so all diagnostics
      # travel in one payload).
      - name: Diagnose rustfmt drift
        continue-on-error: true
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/cv-rustfmt.log 2>&1
          if [ -s /tmp/cv-rustfmt.log ]; then
            payload=$(head -c 6000 /tmp/cv-rustfmt.log | sed -e 's/%/%25/g' -e 's/\r//g' \
              | awk '{printf "%s%%0A", $0}')
            echo "::warning title=cv-fmt::$payload"
          fi

      - name: Diagnose Rust compiler messages
        continue-on-error: true
        run: |
          set +e
          cargo check --workspace --all-targets --locked --message-format=short \
            > /tmp/cv-rust-diagnostics.log 2>&1
          payload=$(grep -E ': (error|warning)' /tmp/cv-rust-diagnostics.log | head -80 \
            | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          if [ -n "$payload" ]; then
            echo "::error title=cv-rustc::$payload"
          fi

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # Every target (library, binary and test code) is checked and a warning fails the job, so a
      # lost integration or a stale binding stays visible. `--locked` makes the checked-in
      # Cargo.lock binding: the build fails instead of quietly resolving different dependency
      # versions than the ones the release was verified with.
      - name: Check the complete Rust workspace without warnings
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --locked --message-format=short 2>&1 | tee /tmp/rust-check.log
          if grep -q ': warning' /tmp/rust-check.log; then
            echo "::error title=Compiler warnings::keep the workspace warning-free; the warnings are listed above"
            exit 1
          fi

      # TEMPORARY diagnostics (remove before merge): surface the failing test output as one
      # annotation, because raw job logs are not always retrievable in this environment.
      - name: Diagnose Rust test failures
        continue-on-error: true
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast > /tmp/cv-rust-tests.log 2>&1
          if grep -q '^failures:$' /tmp/cv-rust-tests.log; then
            payload=$(awk '/^failures:$/{found=1} found' /tmp/cv-rust-tests.log | head -c 6000 \
              | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cv-tests::$payload"
          fi

      - name: Test the complete Rust workspace
        run: cargo test --workspace --locked

  package:
    name: Package ${{ matrix.platform }} test artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact-name: championvibe-windows-test-build
          - platform: android
            os: ubuntu-latest
            artifact-name: championvibe-android-apk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Android Rust target
        if: matrix.platform == 'android'
        run: rustup target add aarch64-linux-android

      - name: Install Windows desktop prerequisites
        if: matrix.platform == 'windows'
        run: choco install wixtoolset --yes --no-progress

      - name: Set up Java for Android Gradle
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages and NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Android Rust bridge tooling
        if: matrix.platform == 'android'
        run: cargo install cargo-ndk --locked

      - name: Install frontend and Tauri CLI dependencies
        run: npm ci

      - name: Build Windows MSI and NSIS installer
        if: matrix.platform == 'windows'
        run: |
          npm run tauri -- build --ci --bundles msi,nsis 2>&1 | Tee-Object -FilePath cv-package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnose Windows packaging failure
        if: failure() && matrix.platform == 'windows'
        run: |
          if (Test-Path cv-package.log) {
            $lines = Get-Content cv-package.log |
              Where-Object { $_ -match '^error(\[E?[0-9]+\])?:' -or $_ -match '^\s+--> ' -or $_ -match '^warning: ' } |
              Select-Object -First 80
            if ($lines) {
              $payload = (($lines -join "`n") -replace '%','%25') -replace "`r?`n", '%0A'
              Write-Output "::error title=cv-cargo::$payload"
            }
          }

      - name: Initialize Tauri Android project
        if: matrix.platform == 'android'
        run: npm run tauri -- android init --ci

      - name: Build Android arm64 APK
        if: matrix.platform == 'android'
        run: |
          set -o pipefail
          npm run tauri -- android build --ci --apk --target aarch64 2>&1 | tee cv-package.log

      - name: Diagnose Android packaging failure
        if: failure() && matrix.platform == 'android'
        shell: bash
        run: |
          [ -f cv-package.log ] || exit 0
          payload=$(grep -E '^error(\[E?[0-9]+\])?:|^[[:space:]]+--> |^warning: ' cv-package.log | head -80 \
            | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          if [ -n "$payload" ]; then
            echo "::error title=cv-cargo::$payload"
          fi
          exit 0

      - name: Collect Windows installers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path target/release/bundle, src-tauri/target/release/bundle -Recurse -File -Include *.msi,*.exe -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts
          if (-not (Get-ChildItem artifacts -File)) { throw 'No Windows MSI/EXE installers were produced.' }

      - name: Collect Android APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android -type f -path '*/build/outputs/apk/*' -name '*.apk' -exec cp '{}' artifacts/ \;
          test -n "$(find artifacts -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload test installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
