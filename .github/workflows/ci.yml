name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      # The headless native-IPC driver asserts the command names, argument spelling and event
      # payloads the WebView bridge carries, so a renamed command or a changed payload shape fails
      # here instead of on a device.
      - name: Run the headless Tauri IPC driver
        run: npm run e2e:tauri

      - name: Set up Java for Android signing checks
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Test native runtime staging and signing without installers
        run: |
          python3 tests/onnx_runtime_test.py
          python3 tests/android_release_signing_test.py
          python3 tests/android_runtime_licenses_test.py
          python3 tests/android_release_manifest_test.py
          python3 tests/download_actions_builds_test.py

      - name: Build frontend
        run: npm run build

      - name: Install Chromium for the simulated Android WebView
        run: npx --no-install playwright-core install --with-deps --only-shell chromium

      - name: Test Android app interaction without an APK
        run: npm run e2e:android

      - name: Build the Cloudflare Pages site
        run: npm run build:site

  compliance:
    name: Cleared-model compliance checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Offline gate: registry pins and tiers, forbidden sources, bundled-weight scan, BYOM
      # acknowledgement rules, CC0 sampleboard bytes, locale transparency and the locked build.
      - name: Verify the cleared-model policy
        run: scripts/verify-cleared-model-policy.sh

  rust:
    name: Rust format, check, and workspace tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux/Tauri audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            portaudio19-dev \
            librsvg2-dev \
            wget

      - name: Install frontend dependencies and generate Tauri assets
        run: |
          npm ci
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # Every target (library, binary and test code) is checked and a warning fails the job, so a
      # lost integration or a stale binding stays visible. `--locked` makes the checked-in
      # Cargo.lock binding: the build fails instead of quietly resolving different dependency
      # versions than the ones the release was verified with.
      - name: Check the complete Rust workspace without warnings
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --locked --message-format=short 2>&1 | tee /tmp/rust-check.log
          if grep -q ': warning' /tmp/rust-check.log; then
            echo "::error title=Compiler warnings::keep the workspace warning-free; the warnings are listed above"
            exit 1
          fi

      - name: Test the complete Rust workspace
        run: cargo test --workspace --locked
