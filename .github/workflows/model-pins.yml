name: Model pins and lockfile

on:
  push:
    paths:
      - "src-tauri/assets/model-registry.json"
      - "scripts/verify-model-pins.sh"
      - ".github/workflows/model-pins.yml"
      - "Cargo.toml"
      - "**/Cargo.toml"
  pull_request:
    paths:
      - "src-tauri/assets/model-registry.json"
      - "scripts/verify-model-pins.sh"
      - ".github/workflows/model-pins.yml"
      - "Cargo.toml"
      - "**/Cargo.toml"
  workflow_dispatch:
    inputs:
      discover_pins:
        description: "Record the SHA-256 that CI actually downloaded in reports/model-pin-verification.json"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Generate the pinned Cargo.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve every workspace dependency version
        run: cargo generate-lockfile --verbose

      - name: Summarize the resolved lockfile
        run: |
          echo "resolved packages: $(grep -c '^\[\[package\]\]' Cargo.lock)"
          sha256sum Cargo.lock
          echo "CARGO_LOCK_SHA256=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "CARGO_LOCK_PACKAGES=$(grep -c '^\[\[package\]\]' Cargo.lock)" >> "$GITHUB_ENV"

      - name: Report the resolved lockfile as an annotation
        run: |
          echo "::notice title=Cargo.lock::$CARGO_LOCK_SHA256 packages=$CARGO_LOCK_PACKAGES"

      - name: Commit the lockfile when it changed
        run: scripts/ci-commit-file.sh Cargo.lock "Lock Rust dependency versions (Cargo.lock, generated by CI)"

      - name: Upload the generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 30

  model-pins:
    name: Verify pinned model downloads
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify every pinned artifact against its SHA-256
        id: verify
        # The report has to be written even when a pin fails, so the job records what the
        # release actually served before it turns red.
        continue-on-error: true
        run: |
          mkdir -p reports
          if [[ "${{ inputs.discover_pins }}" == "true" ]]; then
            scripts/verify-model-pins.sh --allow-pending --report reports/model-pin-verification.json
          else
            scripts/verify-model-pins.sh --report reports/model-pin-verification.json
          fi

      - name: Record the verification report
        if: always()
        run: scripts/ci-commit-file.sh reports/model-pin-verification.json "Record SHA-256 model pin verification from CI"

      - name: Fail when a pin did not verify
        if: steps.verify.outcome == 'failure'
        run: |
          echo "A pinned model artifact did not verify. See reports/model-pin-verification.json." >&2
          exit 1
      - name: Reject separator downloads with unclear rights
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("src-tauri/assets/model-registry.json", "r", encoding="utf-8") as handle:
              registry = json.load(handle)

          forbidden = [source.lower() for source in registry["policy"]["forbiddenDownloadSources"]]
          offenders = []
          for artifact in registry["artifacts"]:
              url = artifact["url"].lower()
              for source in forbidden:
                  if source in url:
                      offenders.append(f"{artifact['id']} -> {source}")

          if offenders:
              print("Uncleared separator sources are downloadable from the standard package:", file=sys.stderr)
              for offender in offenders:
                  print(f"  {offender}", file=sys.stderr)
              sys.exit(1)

          print("No uncleared separator source is downloadable from the standard package.")
          PY
