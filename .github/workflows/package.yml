name: Final packaging

# Deliberately not triggered by push, pull_request, or tags.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-packaging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the selected revision
    uses: ./.github/workflows/ci.yml

  android-native:
    name: Verify the Android native build
    uses: ./.github/workflows/android-native.yml

  package:
    needs: [validate, android-native]
    name: Package ${{ matrix.platform }} test artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact-name: championvibe-windows-test-build
            environment: windows-packaging
          - platform: android
            os: ubuntu-latest
            artifact-name: championvibe-android-apk
            environment: android-release
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.environment }}
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: '28.2.13676358'
      CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Android release signing configuration
        if: matrix.platform == 'android'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ vars.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: python scripts/sign-android-release.py check-config

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Android Rust target
        if: matrix.platform == 'android'
        run: rustup target add aarch64-linux-android

      - name: Install Windows desktop prerequisites
        if: matrix.platform == 'windows'
        run: choco install wixtoolset --yes --no-progress

      - name: Set up Java for Android Gradle
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages and NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "ndk;$ANDROID_NDK_VERSION"
          for variable in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK NDK_HOME; do
            echo "$variable=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          done

      - name: Install Android Rust bridge tooling
        if: matrix.platform == 'android'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install frontend and Tauri CLI dependencies
        run: npm ci

      - name: Stage the Windows x64 ONNX Runtime
        if: matrix.platform == 'windows'
        run: python scripts/stage-onnx-runtime.py windows

      - name: Build Windows MSI and NSIS installer
        if: matrix.platform == 'windows'
        run: npm run tauri -- build --ci --bundles msi,nsis --config src-tauri/tauri.runtime.windows.json

      - name: Initialize Tauri Android project
        if: matrix.platform == 'android'
        run: npm run tauri -- android init --ci

      - name: Prepare the generated project with the stable Android SDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          bash scripts/prepare-android-gradle.sh src-tauri/gen/android

      - name: Stage the Android arm64 ONNX Runtime
        if: matrix.platform == 'android'
        run: python scripts/stage-onnx-runtime.py android

      - name: Stage the Android NDK C++ runtime and notices
        if: matrix.platform == 'android'
        shell: bash
        run: |
          python scripts/stage-onnx-runtime.py stage-android-cxx \
            --ndk "$ANDROID_NDK_HOME" --dest src-tauri/gen/android/app/src/main

      - name: Build Android arm64 APK
        if: matrix.platform == 'android'
        run: npm run tauri -- android build --ci --apk --target aarch64

      - name: Collect Windows installers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path target/release/bundle, src-tauri/target/release/bundle -Recurse -File -Include *.msi,*.exe -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts
          $msi = @(Get-ChildItem artifacts -File -Filter *.msi)
          $nsis = @(Get-ChildItem artifacts -File -Filter *.exe)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) { throw 'Expected exactly one Windows MSI and one NSIS installer.' }
          ($msi + $nsis) | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Sign and verify the Android release APK
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ vars.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          python scripts/sign-android-release.py sign \
            --project src-tauri/gen/android \
            --build-tools "$ANDROID_SDK_ROOT/build-tools/35.0.0" \
            --output artifacts/championvibe-android-arm64.apk
          python scripts/stage-onnx-runtime.py verify-apk artifacts/championvibe-android-arm64.apk --ndk "$ANDROID_NDK_HOME"
          (cd artifacts && sha256sum championvibe-android-arm64.apk > SHA256SUMS.txt)

      - name: Upload candidate installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
