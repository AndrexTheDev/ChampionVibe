name: Native runtime preflight

# Check source archives only; never build or sign an installer.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runtime-preflight.yml'
      - 'scripts/stage-onnx-runtime.py'
      - 'src-tauri/tauri.runtime.windows.json'

permissions:
  contents: read

jobs:
  runtime-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the Windows runtime archive and DLLs
        run: python scripts/stage-onnx-runtime.py windows
      - name: Inspect the Android AAR and record SHA-256 digests
        run: python scripts/stage-onnx-runtime.py inspect-android --report android-onnx-runtime.json
      - name: Upload the Android runtime inspection report
        uses: actions/upload-artifact@v4
        with:
          name: android-onnx-runtime-inspection
          path: android-onnx-runtime.json
          if-no-files-found: error
          retention-days: 30
