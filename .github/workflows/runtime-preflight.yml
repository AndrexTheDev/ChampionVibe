name: Native runtime preflight

# Check source archives only; never build or sign an installer.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runtime-preflight.yml'
      - 'scripts/stage-onnx-runtime.py'
      - 'reports/android-onnx-runtime-*.json'
      - 'legal/onnxruntime/**'
      - 'src-tauri/tauri.runtime.windows.json'

permissions:
  contents: read

jobs:
  runtime-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the Windows runtime archive and DLLs
        run: python scripts/stage-onnx-runtime.py windows
      - name: Inspect the Android AAR and record SHA-256 digests
        run: >-
          python scripts/stage-onnx-runtime.py inspect-android --check-pin
          --stage-dir "$RUNNER_TEMP/android-runtime" --report android-onnx-runtime.json
      - name: Record the inspected runtime in the check summary
        shell: bash
        run: |
          {
            echo '### Android ONNX Runtime (verified against the release pin)'
            echo '```json'
            cat android-onnx-runtime.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PYTHON'
          import json
          from pathlib import Path
          report = json.loads(Path("android-onnx-runtime.json").read_text())
          # Expose compact machine-readable evidence via the GitHub Checks API as well.
          message = json.dumps(report, separators=(",", ":")).replace("%", "%25")
          print(f"::notice title=Android runtime inspection::{message}")
          PYTHON
      - name: Upload the Android runtime inspection report
        uses: actions/upload-artifact@v4
        with:
          name: android-onnx-runtime-inspection
          path: android-onnx-runtime.json
          if-no-files-found: error
          retention-days: 30
