name: Rust diagnostics

# Temporary self-service workflow for the arena/7b9d92de-championvibe branch: it compiles every
# target (library, binary, tests) and commits a compact diagnostics file back to the branch, because
# the maintainer's environment has no Rust toolchain and the Actions logs are not always readable.
# Delete once the workspace reports zero warnings and formatting is clean.

on:
  push:
    branches:
      - arena/7b9d92de-championvibe
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "license-issuer/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Format and compile diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux/Tauri audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            portaudio19-dev \
            librsvg2-dev \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies and generate Tauri assets
        run: |
          npm ci
          npm run build

      - name: Apply rustfmt
        run: cargo fmt --all

      # The report holds only the diagnostic lines: the dependency download noise made the previous
      # full-log report unreadable.
      - name: Compile every target and record the diagnostics
        run: |
          mkdir -p reports
          set +e
          cargo check --workspace --all-targets --message-format=short > /tmp/check.log 2>&1
          status=$?
          set -e
          {
            echo "# Generated by .github/workflows/rust-diagnostics.yml"
            echo "exit=$status"
            echo "warnings=$(grep -c ': warning:' /tmp/check.log || true)"
            echo "errors=$(grep -c ': error' /tmp/check.log || true)"
            grep -E ': (warning|error)' /tmp/check.log || echo "(no warnings or errors)"
          } > reports/rust-diagnostics.txt
          cat reports/rust-diagnostics.txt

      # One commit and one push for the report *and* any rustfmt changes: the token push is the only
      # channel back to the sandbox, so it must not depend on the source tree having changed.
      - name: Commit the diagnostics and any rustfmt changes
        if: always()
        run: |
          git config user.name "championvibe-ci"
          git config user.email "ci@championvibe.invalid"
          git add -A reports
          if git diff --quiet -- '*.rs'; then
            echo "sources are already rustfmt-clean"
          else
            git add -A -- '*.rs'
          fi
          if git diff --cached --quiet; then
            echo "no diagnostics change to commit"
            exit 0
          fi
          git commit -m "Record Rust diagnostics and formatted sources from CI"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "diagnostics pushed to ${{ github.ref_name }}"
