name: Rust formatting helper

on:
  push:
    branches:
      - arena/01a10919-championvibe

permissions:
  contents: write

jobs:
  format:
    name: Apply rustfmt on the session branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format the workspace and push formatting-only changes
        shell: bash
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "Rust workspace is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply cargo fmt workspace formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
