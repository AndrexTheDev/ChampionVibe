[package]
name = "championvibe-issuer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Self-hostable payment-verification and license-issuing service"

[dependencies]
anyhow = "1"
axum = "0.7"
championvibe-licensing-core = { path = "../crates/licensing-core" }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4"] }
