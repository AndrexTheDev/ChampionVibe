import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

// Opt-in Gradle init script for the generated project. No app or plugin source edits.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('collectArm64ReleaseRuntimeInventory') {
        doLast {
            def configuration = app.configurations.getByName('arm64ReleaseRuntimeClasspath')
            def resolution = configuration.incoming.resolutionResult
            def failures = resolution.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
            if (!failures.isEmpty()) {
                throw new GradleException("Unresolved Android runtime dependencies: ${failures*.attempted}")
            }
            def modules = resolution.allComponents.collect { it.id }
                .findAll { it instanceof ModuleComponentIdentifier }.sort { it.displayName }
            if (modules.isEmpty()) {
                throw new GradleException('Android runtime classpath did not resolve any Maven modules')
            }
            def root = new File(app.providers.gradleProperty('runtimeInventoryDir').get())
            def poms = new File(root, 'poms')
            poms.mkdirs()
            def metadata = app.dependencies.createArtifactResolutionQuery()
                .forComponents(modules).withArtifacts(MavenModule, MavenPomArtifact).execute()
            def index = modules.withIndex().collect { id, i ->
                def component = metadata.resolvedComponents.find { it.id == id }
                def artifacts = component?.getArtifacts(MavenPomArtifact)?.findAll { it instanceof ResolvedArtifactResult }
                def pomName = ''
                if (artifacts?.size() == 1) {
                    pomName = "${i}.pom"
                    new File(poms, pomName).bytes = artifacts.first().file.bytes
                }
                [id.group, id.module, id.version, pomName].join('\t')
            }
            new File(root, 'modules.tsv').setText(index.join('\n') + '\n', 'UTF-8')
        }
    }
}
